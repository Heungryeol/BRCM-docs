# =============================================================================
# brcm-docs 수집 설정 (기본값)
#   바꾸고 싶은 값만 config/local.yaml 에 같은 구조로 적으면 덮어씁니다 (local.yaml 은 Git 제외).
# =============================================================================

# 수집기를 정직하게 밝히는 User-Agent (연락처를 넣어 두면 사이트 운영자가 문의할 수 있음)
user_agent: "brcm-docs/0.1 (internal VMware documentation indexer; respects robots.txt)"
delay: 2.0            # 같은 사이트 요청 간 최소 간격(초). robots.txt 의 crawl-delay 가 더 크면 그 값을 따름
data_dir: data        # corpus.sqlite · git 캐시 · 로그 위치

# ----------------------------------------------------------------------------- Broadcom KB
kb:
  enabled: true
  sitemap: https://knowledge.broadcom.com/sitemap.xml
  # vmware: VMware 제품 문서만 본문 저장 (나머지는 제목·제품만 기록) / all: 전부 저장
  scope: vmware
  product_regex: "VMware|vSphere|ESXi|vCenter|vSAN|NSX|Tanzu|Aria|vRealize|Cloud Foundation|HCX|Avi|vDefend|Live Recovery|Site Recovery"
  skip_translations: true   # 일본어 등 번역판(주소가 영문이 아닌 문서)은 제외 — 영문 원문만
  # slug(주소의 제목 부분)에 VMware 단어가 있으면 먼저 수집
  vmware_slug_tokens: [vmware, vsphere, esxi, esx, vcenter, vcsa, vsan, nsx, vcf, sddc, tanzu, aria, vrealize,
                       vrops, vra, vrli, hcx, avi, vmotion, vmkernel, vmk, vds, vmtools, vm, vms, vmdk, vmfs, vmx,
                       photon, harbor, supervisor, vks, tkg, vdefend, srm, vlr, workstation, fusion]
  # scope=vmware 일 때 slug 만 보고 확실히 VMware 가 아닌 문서는 받지 않음 (수집 시간 절약)
  #   --no-slug-skip 으로 끄면 전부 받아서 제품 필드로 판정
  non_vmware_slug_tokens: [symantec, endevor, cics, db2, idms, mainframe, zos, mvs, opsmvs, tpx, jcl, vtam, racf,
                           acf2, siteminder, layer7, clarity, rally, dlp, brocade, autosys, automic, datacom,
                           easytrieve, panvalet, sysview, netmaster, xcom, spectrum, uim, netops, apm, ppm, sep,
                           cloudsoc, proxysg, bluecoat, casb, ztna, wss, smg, ca7, ca11, jobtrac, opscenter, tso,
                           ispf, cobol, roscoe, sannav, edr, icdx]

# ----------------------------------------------------------------------------- techdocs
techdocs:
  enabled: true
  sitemap: https://techdocs.broadcom.com/techdocs2-sitemap.xml
  # 이 경로로 시작하는 페이지 전부 (VCF 9.x 문서 트리). 필요하면 vSphere 8 등 추가
  prefixes:
    - https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/
    # - https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/8-0/
    # - https://techdocs.broadcom.com/us/en/vmware-cis/vsan/vsan/8-0/
  exclude: [/search.html, api-reference, /release-notes/archive]
  max_pages: 0          # 0 = 제한 없음

# ----------------------------------------------------------------------------- 베스트 프랙티스 (GitHub)
github:
  enabled: true
  repos:
    # Broadcom 공식 VCF 보안·컴플라이언스 가이드 (SCG, 하드닝, 랜섬웨어 방어, 보안 설계, 권고문 FAQ)
    - url: https://github.com/vmware/vcf-security-and-compliance-guidelines
      branch: main
      include: ["**/*.md", "**/*.MD", "**/*.pdf", "**/*.csv"]
      exclude: ["regulatory-compliance/**/*.pdf", "**/LICENSE*"]
      prefer_md: true     # 같은 이름의 .md 와 .pdf 가 있으면 .md 만
  max_file_mb: 40
  discover_links: true  # 문서 안의 vmware.com/docs/·techdocs 링크를 대기열에 추가

# ----------------------------------------------------------------------------- 베스트 프랙티스 (URL)
urls:
  enabled: true
  # vmware.com/docs/<이름> 은 백서·설계 가이드·베스트 프랙티스 PDF
  list:
    - https://www.vmware.com/docs/vsphere-esxi-vcenter-server-80-performance-best-practices
    - https://www.vmware.com/docs/vmware-vsan-design-guide
    - https://www.vmware.com/docs/vsan-stretched-cluster-guide
    - https://www.vmware.com/docs/vmw-vsan-encryption-services
    - https://www.vmware.com/docs/vmw-vsan-faqs
    - https://www.vmware.com/docs/avi-vsphere-design-guide
    - https://www.vmware.com/docs/vmware-cloud-foundation-a-technical-overview
    - https://www.vmware.com/docs/vmware-cloud-foundation-9-1-general-faqs
    - https://www.vmware.com/docs/vmware-cloud-foundation-9-1-feature-comparison-and-upgrade-paths
  # 이 패턴의 링크만 discover_links 로 자동 추가
  discover_patterns: ['https://www\.vmware\.com/docs/[a-z0-9-]+']
